[package]
name = "rdw4-spice"
version = "0.1.0"
authors = ["Marc-André Lureau <marcandre.lureau@redhat.com>"]
edition = "2021"

[features]
default = ["bindings"]
bindings = ["rdw/bindings"]
capi = []

[build-dependencies]
cargo_metadata = "0.18"
cbindgen = { path = "../cbindgen", features = ["gobject"] }
system-deps = "6.2"

[package.metadata.system-deps]
rdw4-spice = { version = "0.1", feature = "bindings" }

[dependencies]
log = "0.4"
derivative = "2.2.0"
rdw = { package = "rdw4", path = "../rdw4", default-features = false }
futures = "0.3.30"

[dependencies.spice-client-glib]
version = "0.5.0"
git = "https://gitlab.gnome.org/malureau/spice-gtk-rs.git"

[package.metadata.capi.library]
name = "rdw4-spice"

[package.metadata.capi.header]
name = "rdw-spice"
subdirectory = "rdw4"
generation = false

[package.metadata.capi.pkg_config]
filename = "rdw4-spice"
requires = "rdw4"
