[package]
name = "demo"
version = "0.1.0"
authors = ["Marc-André Lureau <marcandre.lureau@redhat.com>"]
edition = "2021"

[features]
default = ["wayland", "x11"]
bindings = [
    "rdw/bindings",
    "rdw-rdp/bindings",
    "rdw-spice/bindings",
    "rdw-vnc/bindings",
]
wayland = ["rdw/wayland"]
x11 = ["rdw/x11"]

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rdw = { package = "rdw4", path = "../rdw4", default-features = false }
rdw-rdp = { package = "rdw4-rdp", path = "../rdw4-rdp", default-features = false }
rdw-spice = { package = "rdw4-spice", path = "../rdw4-spice", default-features = false }
rdw-vnc = { package = "rdw4-vnc", path = "../rdw4-vnc", default-features = false }

[dependencies.adw]
package = "libadwaita"
features = ["v1_3"]
version = "0.8"
