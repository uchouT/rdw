[package]
name = "rdw4-qemu"
version = "0.1.0"
authors = ["Marc-André Lureau <marcandre.lureau@redhat.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
# TODO: bindings & capi

[dependencies]
log = "0.4"
zbus = { version = "5.0", features = ["p2p", "serde_bytes"] }
futures-util = "0.3"
futures = "0.3"
async-trait = "0.1"
pixman-sys = "0.1.0"
rdw = { package = "rdw4", path = "../rdw4", default-features = false }

[dependencies.qemu-display]
git = "https://gitlab.com/marcandre.lureau/qemu-display.git"
rev = "8ac3da95abeca92e5bb0aee2c58adf54e86f4482"

[target.'cfg(unix)'.dependencies]
usbredirhost = "0.4"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
uds_windows = "1.1.0"
windows = { version = "0.62", features = ["Win32_System_Memory", "Win32_Foundation"] }
