[package]
name = "rdw4-vnc"
version = "0.1.0"
authors = ["Marc-André Lureau <marcandre.lureau@redhat.com>"]
edition = "2021"

[features]
default = []
bindings = ["rdw/bindings"]
capi = []

[build-dependencies]
cargo_metadata.workspace = true
cbindgen = { path = "../cbindgen", features = ["gobject"] }
system-deps = "9.0"

[package.metadata.system-deps]
rdw4-vnc = { version = "0.1", feature = "bindings" }

[dependencies]
log = "0.4"
derivative = "2.2.0"
rdw = { package = "rdw4", path = "../rdw4", default-features = false }

[dependencies.gvnc]
version = "0.7"

[package.metadata.capi.library]
name = "rdw4-vnc"

[package.metadata.capi.header]
name = "rdw-vnc"
subdirectory = "rdw4"
generation = false

[package.metadata.capi.pkg_config]
filename = "rdw4-vnc"
requires = "rdw4"
